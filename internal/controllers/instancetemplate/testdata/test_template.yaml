apiVersion: tpu.google.com/v1alpha1
kind: InstanceTemplate
metadata:
  name: tpu-node-group-test-template
  namespace: default
spec:
  project: ${E2E_PROJECT}
  machineType: tpu7x-standard-4t
  image: projects/ubuntu-os-accelerator-images/global/images/family/ubuntu-accel-2404-amd64-tpu-tpu7x
  bootDiskSizeGB: 250
  diskType: pd-ssd
  subnetwork: regions/us-central1/subnetworks/default
  maintenancePolicy: TERMINATE
  provisioningModel: RESERVATION_BOUND
  reservation: ${E2E_RESERVATION}
  metadata:
    key1: value1
  networkTags:
    - tag1
    - tag2
  serviceAccounts:
    - email: default
      scopes:
        - https://www.googleapis.com/auth/cloud-platform
