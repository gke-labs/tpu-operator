apiVersion: tpu.google.com/v1alpha1
kind: TPUNodeGroup
metadata:
  name: test-nodegroup
  namespace: default
spec:
  project: ${E2E_PROJECT}
  nodeLocation: ${E2E_ZONE}
  nodeCount: 1
  topology: 2x2x1 # Specified topology for single-host slice.
  targetSizePolicyMode: INDIVIDUAL
  acceleratorConnectionMode: STATIC
  bootstrapKubernetes:
    version: "${E2E_K8S_VERSION}"
    controlPlaneIP: "${E2E_CONTROL_PLANE_IP}"
  instanceConfig:
    machineType: tpu7x-standard-4t
    image: projects/ubuntu-os-accelerator-images/global/images/family/ubuntu-accel-2404-amd64-tpu-tpu7x
    bootDiskSizeGB: 250
    diskType: hyperdisk-balanced
    subnetwork: regions/us-central1/subnetworks/default
    provisioningModel: RESERVATION_BOUND
    reservation: ${E2E_RESERVATION}
    metadata:
      key1: value1
    networkTags:
      - tag1
      - tag2
    serviceAccounts:
      - email: default
        scopes:
          - https://www.googleapis.com/auth/cloud-platform
