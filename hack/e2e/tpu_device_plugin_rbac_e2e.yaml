apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tpu-device-plugin
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tpu-device-plugin-e2e-binding
subjects:
- kind: ServiceAccount
  name: tpu-device-plugin-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: tpu-device-plugin
  apiGroup: rbac.authorization.k8s.io
