apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tpu-device-plugin
  labels:
    k8s-app: tpu-device-plugin
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      k8s-app: tpu-device-plugin
  template:
    metadata:
      labels:
        k8s-app: tpu-device-plugin
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
    spec:
      tolerations:
      - operator: "Exists"
        effect: "NoExecute"
      - operator: "Exists"
        effect: "NoSchedule"
      priorityClassName: system-node-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gk8s-tpu-accelerator
                operator: Exists
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: Directory
      - name: dev
        hostPath:
          path: /dev
          type: Directory
      - name: pod-resources
        hostPath:
          path: /var/lib/kubelet/pod-resources
          type: Directory
      - name: tmp
        emptyDir: {}
      containers:
      - name: tpu-device-plugin
        # TODO(b/500811129): Update this image to a production-ready image.
        image: "gcr.io/gsc-nexus-xteam-shared-testing/tpu-device-plugin:latest"
        command:
        - /usr/local/bin/tpu-device-plugin
        - --logtostderr
        - -v=3
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          seccompProfile: { type: RuntimeDefault }
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: dev
          mountPath: /dev
        - name: pod-resources
          mountPath: /var/lib/kubelet/pod-resources
        - name: tmp
          mountPath: /tmp
