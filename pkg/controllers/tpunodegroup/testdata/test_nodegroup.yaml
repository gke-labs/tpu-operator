apiVersion: tpu.google.com/v1alpha1
kind: TPUNodeGroup
metadata:
  name: test-nodegroup
  namespace: default
spec:
  project: gsc-nexus-xteam-shared-testing
  nodeLocation: us-central1-c
  nodeCount: 1
  # Topology is omitted for single-host test cases. If specified, the controller assumes a multi-host slice.
  acceleratorConnectionMode: static
  bootstrapKubernetes:
    version: "1.31"
    controlPlaneIP: "10.128.15.234"
  instanceConfig:
    machineType: tpu7x-standard-4t
    image: projects/ubuntu-os-accelerator-images/global/images/ubuntu-accel-2404-amd64-tpu-tpu7x-v20260320
    bootDiskSizeGB: 250
    diskType: hyperdisk-balanced
    subnetwork: regions/us-central1/subnetworks/default
    provisioningModel: RESERVATION_BOUND
    reservation: cloudtpu-20260414000000-1337732930
    metadata:
      key1: value1
    networkTags:
      - tag1
      - tag2
    serviceAccounts:
      - email: default
        scopes:
          - https://www.googleapis.com/auth/cloud-platform
