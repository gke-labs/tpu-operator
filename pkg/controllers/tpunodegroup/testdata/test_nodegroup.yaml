apiVersion: tpu.google.com/v1alpha1
kind: TPUNodeGroup
metadata:
  name: test-nodegroup
  namespace: default
spec:
  project: gsc-nexus-xteam-shared-testing
  nodeLocation: us-central1-a
  nodeCount: 1
  acceleratorConnectionMode: static
  instanceConfig:
    machineType: tpu7x-standard-4t
    image: projects/ubuntu-os-accelerator-images/global/images/ubuntu-accel-2404-amd64-tpu-tpu7x-v20260320
    bootDiskSizeGB: 250
    diskType: pd-ssd
    subnetwork: regions/us-central1/subnetworks/default
    provisioningModel: RESERVATION_BOUND
    reservation: test-reservation
    metadata:
      key1: value1
    networkTags:
      - tag1
      - tag2
    serviceAccounts:
      - email: default
        scopes:
          - cloud-platform
