apiVersion: v1
kind: Namespace
metadata:
  name: tpu-node-group
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpu-node-group-controller-manager
  namespace: tpu-node-group
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tpu-node-group-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tpu-node-group-manager-role
subjects:
- kind: ServiceAccount
  name: tpu-node-group-controller-manager
  namespace: tpu-node-group
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpu-node-group-controller-manager
  namespace: tpu-node-group
  labels:
    control-plane: tpu-node-group-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: tpu-node-group-controller
  template:
    metadata:
      labels:
        control-plane: tpu-node-group-controller
    spec:
      serviceAccountName: tpu-node-group-controller-manager
      containers:
      - command:
        - /manager
        image: {{CONTROLLER_IMAGE}}
        name: manager
        resources:
          limits:
            cpu: 100m
            memory: 30Mi
          requests:
            cpu: 100m
            memory: 20Mi
        # Uncomment below if using a service account key secret
        # env:
        # - name: GOOGLE_APPLICATION_CREDENTIALS
        #   value: /etc/gcp/key.json
        volumeMounts:
        - name: gcp-credentials
          mountPath: /etc/gcp
          readOnly: true
      volumes:
      - name: gcp-credentials
        secret:
          secretName: tpu-node-group-credentials
          optional: true
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tpu-device-plugin
  labels:
    k8s-app: tpu-device-plugin
roleRef:
  kind: ClusterRole
  name: tpu-device-plugin
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: tpu-device-plugin-sa
  namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-app: tpu-device-plugin
  name: tpu-device-plugin-sa
  namespace: kube-system
