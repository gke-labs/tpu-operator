---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: tpunodegroups.tpu.google.com
spec:
  group: tpu.google.com
  names:
    kind: TPUNodeGroup
    listKind: TPUNodeGroupList
    plural: tpunodegroups
    singular: tpunodegroup
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TPUNodeGroup is the Schema for the tpunodegroups API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TPUNodeGroupSpec defines the desired state of a TPUNodeGroup.
            properties:
              acceleratorConnectionMode:
                description: |-
                  AcceleratorConnectionMode dictates how the chips are interconnected.
                  Currently, the only valid value is static. (Immutable)
                enum:
                - STATIC
                type: string
                x-kubernetes-validations:
                - message: AcceleratorConnectionMode is immutable
                  rule: self == oldSelf
              bootstrapKubernetes:
                description: BootstrapKubernetes defines if and how the controller
                  should install K8s components.
                properties:
                  controlPlaneIP:
                    description: ControlPlaneIP is the IP address of the Kubernetes
                      control plane.
                    type: string
                  version:
                    default: "1.31"
                    description: Version is the Kubernetes version to install.
                    pattern: ^[0-9]+\.[0-9]+$
                    type: string
                required:
                - controlPlaneIP
                type: object
                x-kubernetes-validations:
                - message: BootstrapKubernetes is immutable
                  rule: self == oldSelf
              instanceConfig:
                description: |-
                  InstanceConfig allows the controller to generate an instance template.
                  If specified, InstanceTemplateURI must be omitted.
                properties:
                  bootDiskSizeGB:
                    description: BootDiskSizeGB is the size of the boot disk in GB.
                    format: int32
                    type: integer
                  diskType:
                    description: DiskType specifies the type of the boot disk (e.g.,
                      "pd-ssd", "pd-balanced").
                    type: string
                  image:
                    description: Image is the boot disk image URI.
                    type: string
                  machineType:
                    description: MachineType is the GCE machine type (e.g., "tpu7x-standard-4t").
                    maxLength: 63
                    type: string
                    x-kubernetes-validations:
                    - message: Only v6 and v7 TPU machine types are supported
                      rule: self.matches('^(tpu7x-|tpu7-|ct6e-).*')
                  metadata:
                    additionalProperties:
                      type: string
                    description: Metadata allows setting custom GCE metadata.
                    type: object
                  networkTags:
                    description: NetworkTags are used to apply GCP firewall rules
                      to the TPU nodes.
                    items:
                      type: string
                    type: array
                  provisioningModel:
                    description: |-
                      ProvisioningModel specifies SPOT, RESERVATION_BOUND, or STANDARD.
                      Defaults to RESERVATION_BOUND if the reservation field is specified.
                      Defaults to STANDARD if neither this field nor the reservation field is specified.
                    enum:
                    - SPOT
                    - RESERVATION_BOUND
                    - STANDARD
                    type: string
                  reservation:
                    description: |-
                      Reservation is the name of the reservation to consume.
                      Required if ProvisioningModel is "reservation-bound.
                    type: string
                  serviceAccounts:
                    description: |-
                      ServiceAccounts is a list of service accounts and their scopes.
                      Note: GCE currently only supports at most ONE service account per instance.
                    items:
                      description: ServiceAccount defines the service account and
                        scopes for the VM.
                      properties:
                        email:
                          description: Email is the service account email. Use "default"
                            to use the default compute service account.
                          type: string
                        scopes:
                          description: Scopes is a list of OAuth scopes for the service
                            account.
                          items:
                            type: string
                          type: array
                      required:
                      - email
                      - scopes
                      type: object
                    maxItems: 1
                    type: array
                  subnetwork:
                    default: default
                    description: Subnetwork is the VPC subnetwork URI.
                    type: string
                required:
                - machineType
                type: object
                x-kubernetes-validations:
                - message: InstanceConfig is immutable
                  rule: self == oldSelf
              instanceTemplateURI:
                description: |-
                  InstanceTemplateURI is the URI of an existing GCE instance template to use.
                  This field is immutable once set.
                  If specified, InstanceConfig must be omitted.
                maxLength: 255
                type: string
                x-kubernetes-validations:
                - message: InstanceTemplateURI is immutable
                  rule: self == oldSelf
              minNodeCount:
                description: MinNodeCount is the minimum required for a single-host
                  slice.
                format: int32
                type: integer
                x-kubernetes-validations:
                - message: MinNodeCount is immutable
                  rule: self == oldSelf
              nodeCount:
                description: NodeCount is the total number of VMs desired.
                format: int32
                type: integer
                x-kubernetes-validations:
                - message: NodeCount is immutable
                  rule: self == oldSelf
              nodeLocation:
                description: NodeLocation is the GCE Zone where the nodes will be
                  provisioned.
                type: string
                x-kubernetes-validations:
                - message: NodeLocation is immutable
                  rule: self == oldSelf
              project:
                description: Project is the GCP project ID.
                maxLength: 30
                pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
                type: string
                x-kubernetes-validations:
                - message: Project is immutable
                  rule: self == oldSelf
              targetSizePolicyMode:
                description: |-
                  TargetSizePolicyMode specifies the mode of target size policy for the underlying MIG.
                  Supported values are BULK and INDIVIDUAL.
                enum:
                - BULK
                - INDIVIDUAL
                type: string
                x-kubernetes-validations:
                - message: TargetSizePolicyMode is immutable
                  rule: self == oldSelf
              topology:
                description: |-
                  Topology specifies the physical arrangement of the TPU chips.
                  Required for both single-host and multi-host slices to enable proper node labeling.
                type: string
                x-kubernetes-validations:
                - message: Topology is immutable
                  rule: self == oldSelf
            required:
            - acceleratorConnectionMode
            - nodeCount
            - nodeLocation
            - project
            - targetSizePolicyMode
            - topology
            type: object
            x-kubernetes-validations:
            - message: targetSizePolicyMode must be INDIVIDUAL when nodeCount is 1
                or less
              rule: self.nodeCount > 1 || self.targetSizePolicyMode == 'INDIVIDUAL'
            - message: Either InstanceConfig or InstanceTemplateURI must be specified
              rule: has(self.instanceConfig) || has(self.instanceTemplateURI)
            - message: InstanceConfig and InstanceTemplateURI cannot be specified
                together
              rule: '!(has(self.instanceConfig) && has(self.instanceTemplateURI))'
            - message: Bootstrapping is not supported when bringing your own instance
                template
              rule: '!has(self.instanceTemplateURI) || !has(self.bootstrapKubernetes)'
            - message: InstanceTemplateURI must belong to the same project as specified
                in spec.project
              rule: '!has(self.instanceTemplateURI) || self.instanceTemplateURI.matches(''^projects/''
                + self.project + ''/(locations/[^/]+|regions/[^/]+|global)/instanceTemplates/[a-z0-9-]+$'')'
          status:
            description: TPUNodeGroupStatus defines the observed state of a TPUNodeGroup.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of an object's current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              nodeSummary:
                description: NodeSummary provides a high-level count of nodes in various
                  states.
                properties:
                  failed:
                    description: Failed is the number of nodes that failed to provision
                      or join.
                    format: int32
                    type: integer
                  ready:
                    description: Ready is the number of nodes that are ready and registered
                      in the cluster.
                    format: int32
                    type: integer
                  reconciling:
                    description: Reconciling is the number of nodes currently being
                      reconciled.
                    format: int32
                    type: integer
                required:
                - failed
                - ready
                - reconciling
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
